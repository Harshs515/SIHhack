<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ─── PWA Core ─── -->
    <script>
      (function() {
        var isOfficer = window.location.pathname.startsWith('/field-officer');
        document.write('<link id="app-manifest" rel="manifest" href="' + (isOfficer ? '/manifest-officer.json' : '/manifest.json') + '" />');
      })();
    </script>
    <noscript>
      <link id="app-manifest" rel="manifest" href="/manifest.json" />
    </noscript>
    <meta name="theme-color" content="#00e5ff" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: light)" />

    <!-- ─── iOS PWA ─── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRINETRA" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128.png" />
    <!-- iOS Splash Screens -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ─── Windows / Microsoft ─── -->
    <meta name="msapplication-TileColor" content="#070b14" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
    <meta name="msapplication-config" content="none" />

    <!-- ─── Standard SEO ─── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TRINETRA CyberDrishti — India's National Cybercrime Predictive Command & Mule Account Interceptor Platform powered by AI/ML." />
    <meta name="keywords" content="cybercrime, NCRP, mule accounts, cybersecurity, India, law enforcement, AI, predictive analytics" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="application-name" content="TRINETRA" />

    <!-- ─── Open Graph ─── -->
    <meta property="og:title" content="TRINETRA CyberDrishti" />
    <meta property="og:description" content="National Cybercrime Predictive Command & Mule Interceptor Platform" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- ─── Favicon ─── -->
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <title>TRINETRA CyberDrishti — National Cybercrime Predictive Command &amp; Mule Interceptor</title>

    <!-- ─── Google Fonts ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
